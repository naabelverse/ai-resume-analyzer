name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version`: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Railway (Railpack) resolves engines.node ">=22.13.0" to the newest 22.x,
      # so "22" tracks the same line rather than pinning a patch that drifts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      # Also runs `prisma generate` via postinstall.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Offline suite only. test:live, test:quality and test:eval spend API
      # credits and are excluded from vitest.config.mts by name.
      - run: pnpm test

      # No env needed: every variable in lib/env.ts has a default, and
      # instrumentation.ts reports env problems without throwing during build.
      - run: pnpm build
